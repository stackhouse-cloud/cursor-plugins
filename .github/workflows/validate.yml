name: Validate Cursor Plugins

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run marketplace validator tests
        run: node --test scripts/validate.test.mjs
      - name: Validate marketplace manifests and plugins
        run: node scripts/validate.mjs
